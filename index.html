function wishlist(){const a=products.filter(p=>S.wish.includes(p.id));return sec(`${head('Favoritmu','Wishlist')}<div class="${G4}">${a.length?a.map(card).join(''):empty('heart','Wishlist masih kosong','Ketuk ikon hati di produk untuk menyimpannya.','Jelajahi katalog','catalog')}</div>`,'max-w-7xl')}

function detail(id){const p=products.find(x=>x.id===id)||products[0],s=p.status==='SOLD OUT',ps=p.passport,m=ps.measurements,sim=products.filter(x=>x.id!==p.id&&x.category===p.category).slice(0,4);
return sec(`<button onclick="go('catalog')" class="btn-g mb-5"><i data-lucide="chevron-left" class="w-4 h-4"></i>Katalog</button><div class="grid md:grid-cols-2 gap-8 items-start"><div class="glass p-2 relative md:sticky md:top-24"><img referrerpolicy="no-referrer" src="${p.image}" alt="${p.name}" class="rounded-[22px] w-full aspect-[4/5] object-cover ${s?'grayscale opacity-75':''}"><div class="glass-d absolute bottom-5 left-5 right-5 rounded-2xl px-4 py-3 flex justify-between text-[10px] font-bold tracking-wider uppercase"><span>Studio neutral lighting</span><span class="opacity-70">Raw unedited photo</span></div></div>
<div class="space-y-5"><div class="flex items-center gap-2 flex-wrap"><span class="eyebrow">${p.brand} · ${p.era}</span><span class="pill ${s?'bg-gray-900 text-white':'bg-emerald-100 text-emerald-800'}">${p.status}</span></div><h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight">${p.name}</h1><div class="flex items-end gap-3"><span class="text-3xl font-extrabold text-brand">${IDR(p.price)}</span><span class="line-through text-gray-400 text-sm mb-1">${IDR(p.oldPrice)}</span></div>

${s?`<div class="glass !rounded-2xl p-4 text-center font-bold text-gray-600">Sudah terjual</div>`:`<div class="grid sm:grid-cols-2 gap-3"><button onclick="add(${p.id})" class="btn-g !py-4 !text-brand"><i data-lucide="shopping-bag" class="w-4 h-4"></i>Tambah ke Keranjang</button><button onclick="add(${p.id},1)" class="btn">Beli Sekarang →</button></div>`}
<a target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent('Halo CS Thrifterfav, saya mau tanya produk '+p.name)}" class="btn btn-w w-full"><i data-lucide="message-circle" class="w-4 h-4"></i>Tanya via WhatsApp</a></div></div>

${sim.length?`<h3 class="text-2xl font-extrabold tracking-tight mt-12 mb-4">Item serupa</h3><div class="${G4}">${sim.map(card).join('')}</div>`:''}`)}

function cart(){const a=items();return sec(`<div class="flex flex-wrap justify-between items-center gap-3 mt-6 mb-5"><h1 class="ttl">Keranjang</h1>${a.length?`<span class="pill glass text-brand !text-xs"><i data-lucide="clock" class="w-4 h-4"></i>Stok dikunci <b id="stockTimer" class="font-mono">${fmt(S.lock-Date.now())}</b></span>`:''}</div>
${!a.length?`<div class="grid">${empty('shopping-bag','Keranjang masih kosong','Jelajahi katalog untuk mengunci stok pilihanmu.','Jelajahi katalog','catalog')}</div>`:`<div class="grid md:grid-cols-3 gap-6 items-start"><div class="md:col-span-2 space-y-3">${a.map(i=>`<div class="glass !rounded-3xl p-4 flex items-center gap-4"><img referrerpolicy="no-referrer" src="${i.image}" class="w-20 h-20 rounded-2xl object-cover cursor-pointer" onclick="go('detail',${i.id})"><div class="flex-1 min-w-0"><h4 class="font-semibold text-sm line-clamp-2">${i.name}</h4><p class="text-xs text-gray-500">${i.brand} · Size ${i.size}</p><b class="text-brand">${IDR(i.price)}</b></div><button onclick="del(${i.id})" class="gb" aria-label="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}</div>

function checkout(){const a=items();if(!a.length)return sec(`<div class="grid mt-8">${empty('shopping-bag','Tidak ada item untuk di-checkout','Tambahkan produk ke keranjang dulu.','Ke katalog','catalog')}</div>`);

return sec(`${head('Checkout','Selesaikan pesananmu')}<form onsubmit="order(event)" oninput="upT()" class="grid md:grid-cols-5 gap-6 items-start"><div class="md:col-span-3 space-y-6"><div class="glass p-6 space-y-4">${H(1,'Data penerima')}<div class="grid sm:grid-cols-2 gap-4"><div>${L('Nama lengkap')}<input id="cn" required class="in"></div><div>${L('WhatsApp / HP')}<input id="cp" required inputmode="tel" class="in"></div></div><div>${L('Email')}<input id="ce" type="email" required class="in"></div><div>${L('Alamat lengkap pengiriman')}<textarea id="ca" rows="3" required class="in"></textarea></div></div>
<div class="glass p-6 space-y-3">${H(2,'Kurir &amp; ongkir')}${[[18000,'JNE Reguler','2–3 hari'],[22000,'J&amp;T Express','1–2 hari'],[35000,'SiCepat Sameday','Hari yang sama']].map((c,i)=>`<label class="opt"><input type="radio" name="cr" value="${c[0]}" ${i?'':'checked'}><i data-lucide="truck" class="w-5 h-5 text-brand"></i><div class="flex-1"><b>${c[1]}</b><div class="text-xs text-gray-500">${c[2]}</div></div><b>${IDR(c[0])}</b></label>`).join('')}</div>

function upT(){const f=+document.querySelector('[name=cr]:checked').value;$('fee').textContent=IDR(f);$('tot').textContent=IDR(sub()+f)}
function order(e){e.preventDefault();const f=+document.querySelector('[name=cr]:checked').value;S.order={id:'TRF-'+(100000+Math.random()*900000|0),items:S.cart.slice(),subtotal:sub(),fee:f,total:sub()+f,method:document.querySelector('[name=pm]:checked').value,name:$('cn').value,status:STEPS[0],date:new Date().toLocaleDateString('id-ID'),exp:Date.now()+9e5};S.cart=[];S.lock=0;save();go('payment')}

if(o.status!==STEPS[0])return sec(`<div class="grid mt-8">${empty('check-circle-2','Pembayaran diterima','Pesanan '+o.id+' sedang diverifikasi & di-QC gudang.','Lacak pesanan','orders')}</div>`);
const q=o.method==='QRIS',wa=`https://wa.me/${WA}?text=${encodeURIComponent(`Halo Thrifterfav, saya sudah bayar via ${PM[o.method][0]}.\nOrder ID: ${o.id}\nTotal: ${IDR(o.total)}\nMohon dicek ya, terima kasih.`)}`;
return sec(`${head('Pembayaran','Selesaikan pembayaran')}<div class="grid md:grid-cols-2 gap-6 items-start max-w-4xl mx-auto"><div class="glass p-6 space-y-4 text-center"><span class="pill glass-s border border-black/5 mx-auto"><i data-lucide="clock" class="w-3.5 h-3.5"></i>Bayar dalam <b id="payTimer" class="font-mono text-brand">${fmt(o.exp-Date.now())}</b></span><div><div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total pembayaran</div><div class="text-4xl font-extrabold text-brand tracking-tight">${IDR(o.total)}</div><div class="text-xs text-gray-500 mt-1">Order ${o.id}</div></div>
<button onclick="copy('${o.total}','Nominal disalin')" class="btn-g mx-auto"><i data-lucide="copy" class="w-4 h-4"></i>Salin nominal</button>
${q?`<div class="bg-white rounded-3xl p-3 shadow-xl max-w-[300px] mx-auto"><div class="text-[11px] font-extrabold tracking-[.25em] text-gray-800 pt-1">QRIS</div><img referrerpolicy="no-referrer" src="${QR}" alt="QRIS ${QNAME}" class="w-full rounded-2xl"><div class="text-xs font-bold pb-1">${QNAME}</div><div class="text-[10px] text-gray-500 pb-1">NMID: ${NMID}</div></div><a href="${QR}" download="QRIS-Thrifterfav.jpg" class="btn-g mx-auto"><i data-lucide="download" class="w-4 h-4"></i>Simpan QR</a>`:`<div class="bg-white/70 rounded-2xl p-5 space-y-2"><div class="text-xs font-bold text-gray-500 uppercase">${PM[o.method][0]}</div><div class="text-2xl font-mono font-extrabold tracking-wider">${VA}</div><button onclick="copy('${VA.replace(/ /g,'')}','Nomor VA disalin')" class="text-sm font-bold text-brand">Salin nomor VA</button></div>`}</div>
<div class="space-y-4"><div class="glass p-6 space-y-3"><h3 class="font-bold text-lg">Cara bayar</h3>${(q?['Buka e-wallet atau m-banking, pilih Scan / Bayar QRIS','Scan QR di samping (atau unggah QR yang disimpan)',`Masukkan nominal <b>persis ${IDR(o.total)}</b>`,'Selesaikan pembayaran, lalu klik “Saya sudah bayar”']:['Buka ATM / m-banking, pilih Transfer Virtual Account','Masukkan nomor VA di samping',`Pastikan nominal <b>${IDR(o.total)}</b>`,'Selesaikan, lalu klik “Saya sudah bayar”']).map((s,i)=>`<div class="flex gap-3 text-sm items-start"><span class="w-6 h-6 shrink-0 rounded-full bg-brand text-white text-xs grid place-items-center">${i+1}</span><span>${s}</span></div>`).join('')}${q?'<div class="text-xs bg-amber-50/80 text-amber-900 rounded-2xl p-3">QRIS ini statis, jadi nominal diisi manual. Pesanan diproses setelah admin memverifikasi pembayaran.</div>':''}</div>
<button onclick="paid()" class="btn w-full">Saya sudah bayar</button><a target="_blank" href="${wa}" class="btn btn-w w-full"><i data-lucide="message-circle" class="w-4 h-4"></i>Kirim bukti via WhatsApp</a></div></div>`,'max-w-5xl')}
function paid(){S.order.status=STEPS[1];save();toast('Terima kasih! Pembayaran sedang diverifikasi','badge-check');go('orders')}

function orders(){const o=S.order,st=o?STEPS.indexOf(o.status):0,nx=['','Demo: tandai dikirim','Konfirmasi pesanan diterima','Beri review'];
return sec(`<div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mt-6 mb-5"><h1 class="ttl">Lacak Pesanan</h1><label class="in !rounded-full flex gap-2 sm:w-72 !py-2"><input id="os" placeholder="Masukkan ID order…" class="bg-transparent outline-none w-full text-sm"><button type="button" onclick="const v=$('os').value.trim().toUpperCase();toast(S.order&&S.order.id===v?'Pesanan ditemukan':'Pesanan tidak ditemukan',S.order&&S.order.id===v?'check-circle-2':'search-x')" class="font-bold text-brand text-sm">Cari</button></label></div>
${!o?`<div class="grid">${empty('package','Belum ada pesanan aktif','Selesaikan transaksi untuk melihat timeline pengiriman.','Mulai belanja','catalog')}</div>`:`<div class="glass p-6 sm:p-8 space-y-6"><div class="flex flex-wrap justify-between gap-3 border-b border-black/5 pb-4"><div><div class="text-xs text-gray-500 font-mono">ORDER · ${o.date} · ${PM[o.method][0]}</div><div class="text-2xl font-extrabold">${o.id}</div></div><span class="pill bg-emerald-100 text-emerald-800 self-start">${STL[st]}</span></div>
<div class="grid grid-cols-4 gap-2 text-center">${STL.map((l,i)=>`<div class="space-y-2"><div class="h-1.5 rounded-full ${i<=st?'bg-brand':'bg-black/10'}"></div><div class="text-[11px] font-semibold ${i<=st?'text-brand':'text-gray-400'}">${l}</div></div>`).join('')}</div>
<div class="space-y-3">${o.items.map(id=>products.find(p=>p.id===id)).filter(Boolean).map(i=>`<div class="flex gap-3 items-center bg-white/60 rounded-2xl p-3"><img referrerpolicy="no-referrer" src="${i.image}" class="w-14 h-14 rounded-xl object-cover"><div class="flex-1 text-sm font-semibold line-clamp-2">${i.name}</div><b class="text-sm">${IDR(i.price)}</b></div>`).join('')}<div class="flex justify-between font-extrabold pt-2"><span>Total (termasuk ongkir)</span><span class="text-brand">${IDR(o.total)}</span></div></div>
${st>=2?'<div class="bg-white/60 rounded-2xl p-4 text-xs font-mono"><b>Nomor resi:</b> JNE-TRF-9021839012 (Gudang Central Jakarta)</div>':''}
<div class="flex flex-wrap gap-3">${st===0?`<button onclick="go('payment')" class="btn">Lanjut ke pembayaran</button>`:st<3?`<button onclick="S.order.status=STEPS[${st+1}];save();render()" class="btn">${nx[st]}</button>`:''}<button onclick="go('contact')" class="btn-g">Ajukan komplain / retur</button></div></div>`}`,'max-w-4xl')}

function how(){return sec(`${head('Pendukung kepercayaan','Cara Kerja & Jaminan','Inspeksi gudang yang transparan, garansi komplain, dan FAQ.')}<div class="grid md:grid-cols-3 gap-5">${[['package','Konsinyasi gudang','Seller mengirim stok ke gudang terpusat untuk disortir.'],['ruler','QC & ukur centimeter','Tim fisik memeriksa kecacatan dan mencatat ukuran asli dalam cm.'],['shield-check','Garansi retur 2×24 jam','Dana ditahan escrow sampai kamu puas dengan pesanan.']].map((s,i)=>`<div class="glass lift p-7 space-y-3"><span class="gb !w-12 !h-12 !bg-brand text-white"><i data-lucide="${s[0]}" class="w-6 h-6"></i></span><div class="eyebrow">Langkah ${i+1}</div><h3 class="font-bold text-lg">${s[1]}</h3><p class="text-sm text-gray-600">${s[2]}</p></div>`).join('')}</div>
<div class="glass p-6 sm:p-8 mt-6 space-y-4"><h3 class="text-2xl font-extrabold tracking-tight">FAQ &amp; aturan retur</h3>${[['Kapan saya bisa mengajukan komplain retur?','Jika ukuran selisih lebih dari 3 cm dari Inspection Passport atau ada cacat fatal yang tidak tertulis.'],['Berapa biaya admin pembeli?','Rp0 platform fee dan Rp0 packing fee. Kamu hanya membayar harga barang + ongkir.'],['Bagaimana pembayaran QRIS diverifikasi?','Setelah membayar, klik “Saya sudah bayar” dan kirim bukti via WhatsApp. Admin memverifikasi lalu pesanan masuk QC.']].map(f=>`<details class="bg-white/60 rounded-2xl p-4"><summary>${f[0]}<i data-lucide="chevron-down" class="w-4 h-4 transition"></i></summary><p class="text-sm text-gray-600 mt-3">${f[1]}</p></details>`).join('')}<div class="flex flex-wrap gap-3 pt-2"><button onclick="go('catalog')" class="btn">Mulai belanja</button><a target="_blank" href="https://wa.me/${WA}" class="btn btn-w"><i data-lucide="message-circle" class="w-4 h-4"></i>Hubungi Customer Service</a></div></div>`,'max-w-5xl')}

function about(){return sec(`${head('Cerita kami','About Thrifterfav')}<div class="grid md:grid-cols-2 gap-6 items-center"><img referrerpolicy="no-referrer" src="https://images.unsplash.com/photo-1647664856968-880b8eccd588?auto=format&fit=crop&w=800&q=80" class="glass !rounded-[32px] p-2 w-full aspect-square object-cover" alt=""><div class="space-y-4"><h3 class="text-2xl font-extrabold tracking-tight">Menolak catfish foto thrift</h3><p class="text-gray-600 leading-relaxed">Thrifterfav dibangun di atas satu aturan baku: “Checked first, then shipped.” Kami menghilangkan risiko thrift online dengan memusatkan penyimpanan, pembersihan, dan verifikasi di gudang terpusat.</p></div></div>
<div class="glass p-8 sm:p-10 mt-8 space-y-4"><h3 class="text-2xl font-extrabold tracking-tight text-brand">Ingin jadi partner seller konsinyasi?</h3><p class="text-sm text-gray-600">Titipkan stok thrift kamu di gudang Thrifterfav. Kami urus foto studio, pengukuran cm, dan pengiriman dengan komisi 0%.</p><div class="flex flex-wrap gap-3"><a target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent('Halo, saya tertarik jadi Partner Seller')}" class="btn btn-w">Daftar via WhatsApp</a><a target="_blank" href="https://instagram.com" class="btn-g"><i data-lucide="instagram" class="w-4 h-4"></i>Instagram kami</a></div></div>`,'max-w-5xl')}

function gallery(){return sec(`${head('Portfolio','Lookbook & Curation Archive')}<div class="grid grid-cols-2 md:grid-cols-4 gap-4">${products.map(p=>`<div onclick="go('detail',${p.id})" class="glass lift !rounded-3xl p-1.5 cursor-pointer"><img referrerpolicy="no-referrer" src="${p.image}" alt="${p.name}" class="w-full aspect-square object-cover rounded-[22px]"></div>`).join('')}</div>`,'max-w-6xl')}
function blog(){return sec(`${head('Guides & articles','Thrifterfav Journal','Panduan kurasi, perawatan vintage, dan kebijakan.')}<div class="space-y-5">${articles.map(a=>`<div onclick="go('article',${a.id})" class="glass lift cursor-pointer p-4 grid md:grid-cols-12 gap-5 items-center"><img referrerpolicy="no-referrer" src="${a.image}" class="md:col-span-5 w-full aspect-video object-cover rounded-[22px]" alt=""><div class="md:col-span-7 space-y-3 p-2"><div class="flex gap-2"><span class="pill bg-brand/10 text-brand">${a.category}</span><span class="pill text-gray-500">${a.readTime}</span></div><h3 class="text-2xl font-extrabold tracking-tight leading-snug">${a.title}</h3><p class="text-sm text-gray-600">${a.summary}</p><div class="text-xs text-gray-400 font-semibold">By ${a.author} · ${a.date}</div></div></div>`).join('')}</div>`,'max-w-4xl')}
function article(id){const a=articles.find(x=>x.id===id)||articles[0];return sec(`<button onclick="go('blog')" class="btn-g mb-5"><i data-lucide="chevron-left" class="w-4 h-4"></i>Blog</button><div class="space-y-3 mb-6"><div class="flex gap-2"><span class="pill bg-brand/10 text-brand">${a.category}</span><span class="pill text-gray-500">${a.readTime}</span></div><h1 class="ttl">${a.title}</h1><div class="text-xs text-gray-500">By ${a.author} · ${a.date}</div></div><img referrerpolicy="no-referrer" src="${a.image}" class="glass !rounded-[28px] p-1.5 w-full aspect-video object-cover mb-6" alt=""><div class="glass p-6 sm:p-10 text-sm leading-relaxed text-gray-800">${a.content}</div>`,'max-w-3xl')}
function contact(){return sec(`${head('Layanan pelanggan','Hubungi Tim Customer Service')}<form onsubmit="event.preventDefault();this.reset();toast('Pesan terkirim ke CS','send')" class="glass p-6 sm:p-10 space-y-4"><div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Nama</label><input required class="in"></div><div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Pesan / pertanyaan</label><textarea rows="4" required class="in"></textarea></div><button class="btn w-full">Kirim pesan</button><a target="_blank" href="https://wa.me/${WA}" class="btn btn-w w-full"><i data-lucide="message-circle" class="w-4 h-4"></i>Atau chat WhatsApp</a></form>`,'max-w-2xl')}

setInterval(()=>{const n=Date.now();if(S.cart.length&&S.lock&&n>S.lock){S.cart=[];S.lock=0;save();toast('Waktu penguncian stok habis, keranjang dikosongkan','clock');render()}const a=$('stockTimer');if(a&&S.lock)a.textContent=fmt(S.lock-n);const b=$('payTimer');if(b&&S.order)b.textContent=fmt(S.order.exp-n)},1000);
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c1cb"/><stop offset="1" stop-color="#c9d4ff"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><text x="200" y="262" font-family="sans-serif" font-size="26" font-weight="700" fill="#9b1b30" text-anchor="middle">Thrifterfav</text></svg>');
addEventListener('error',e=>{const i=e.target;if(i&&i.tagName==='IMG'&&!i.dataset.f){i.dataset.f=1;const q=products.find(x=>x.image===i.src);i.src=q?q.fb:PH}},true);
const app=$('app');render();
</script>
</body>
</html>
